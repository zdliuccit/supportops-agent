[project]
name = "supportops-core"
version = "0.1.0"
description = "企业智能支持平台共享领域与基础设施能力"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "cryptography>=45.0.0",
  "httpx>=0.28.1",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "pyjwt>=2.10.1",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "psycopg[binary,pool]>=3.3.0",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
