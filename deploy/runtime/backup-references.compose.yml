# 只挂载独立恢复引用清单，不挂载归档、连接文件、密钥或应用环境。
name: supportops-backup-references
services:
  references:
    image: ${SUPPORTOPS_BACKUP_INSPECTOR_IMAGE:?请设置已批准的Python3.12镜像digest}
    user: ${SUPPORTOPS_BACKUP_UID:?请指定清单所属维护UID}:${SUPPORTOPS_BACKUP_GID:?请指定维护GID}
    entrypoint: ["python", "-I", "-B", "/opt/supportops/backup_inspect.py"]
    command: ["--help"]
    volumes:
      - type: bind
        source: ./backup_inspect.py
        target: /opt/supportops/backup_inspect.py
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPORTOPS_BACKUP_RECOVERY_REFERENCES_DIR:?请指定仅含恢复引用清单的私有目录}
        target: /references
        read_only: true
        bind: { create_host_path: false }
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: "no"
    stop_grace_period: 10s
