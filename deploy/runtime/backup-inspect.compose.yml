# 仅挂载待核验产物：无数据库连接文件、无应用配置、无网络和写入卷。
name: supportops-backup-inspect
services:
  inspect:
    image: ${SUPPORTOPS_BACKUP_INSPECTOR_IMAGE:?请设置已批准的Python3.12镜像digest}
    user: ${SUPPORTOPS_BACKUP_UID:?请指定产物所属维护UID}:${SUPPORTOPS_BACKUP_GID:?请指定维护GID}
    entrypoint: ["python", "-I", "-B", "/opt/supportops/backup_inspect.py"]
    command: ["--help"]
    volumes:
      - type: bind
        source: ./backup_inspect.py
        target: /opt/supportops/backup_inspect.py
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPORTOPS_BACKUP_ARCHIVE_DIR:?请指定已存在的单个备份产物目录}
        target: /backup
        read_only: true
        bind: { create_host_path: false }
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: "no"
    stop_grace_period: 10s
