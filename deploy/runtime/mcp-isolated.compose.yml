# 独立显式入口；不继承应用Compose的env_file、卷、网络或依赖服务。
name: supportops-isolated-mcp
services:
  mcp-isolated:
    profiles: ["mcp-isolated"]
    image: ${SUPPORTOPS_MCP_ISOLATED_IMAGE:?请设置已批准的隔离Mock镜像引用}
    build:
      context: ../..
      dockerfile: deploy/runtime/mcp-isolated.Dockerfile
      args:
        PYTHON_IMAGE: ${SUPPORTOPS_PYTHON_IMAGE:?请设置 Python 3.12 的已批准 digest}
        UV_IMAGE: ${SUPPORTOPS_UV_IMAGE:?请设置 uv 的已批准 digest}
    user: "10002:10002"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    ulimits:
      nofile: {soft: 64, hard: 64}
      core: {soft: 0, hard: 0}
      cpu: {soft: 10, hard: 12}
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777"]
    init: true
    restart: "no"
    stop_grace_period: 15s
    command: ["catalog"]
