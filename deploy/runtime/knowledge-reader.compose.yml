# 与应用及knowledge-parser覆盖文件显式合并；来源仅挂给读取器，API只挂socket。
services:
  knowledge-reader-ipc-init:
    profiles: ["knowledge-reader"]
    image: ${SUPPORTOPS_KNOWLEDGE_READER_IMAGE:?请设置已批准的独立读取镜像引用}
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/bin/install", "-d", "-m", "0770", "-o", "10006", "-g", "10001", "/run/supportops-knowledge-reader"]
    volumes: ["knowledge-reader-ipc:/run/supportops-knowledge-reader"]
    restart: "no"
  knowledge-reader:
    profiles: ["knowledge-reader"]
    image: ${SUPPORTOPS_KNOWLEDGE_READER_IMAGE:?请设置已批准的独立读取镜像引用}
    build:
      context: ../..
      dockerfile: deploy/runtime/knowledge-reader.Dockerfile
      args:
        PYTHON_IMAGE: ${SUPPORTOPS_PYTHON_IMAGE:?请设置 Python 3.12 的已批准 digest}
    user: "10006:10006"
    group_add: ["10001"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    ulimits:
      nofile: {soft: 32, hard: 32}
      nproc: {soft: 16, hard: 16}
      core: {soft: 0, hard: 0}
      cpu: {soft: 2, hard: 3}
      as: {soft: 268435456, hard: 268435456}
    init: true
    restart: "no"
    logging: {driver: "none"}
    stop_grace_period: 2s
    depends_on:
      knowledge-reader-ipc-init: {condition: service_completed_successfully}
    volumes:
      - knowledge-reader-ipc:/run/supportops-knowledge-reader
      - type: bind
        source: ${SUPPORTOPS_KNOWLEDGE_READER_SOURCE_DIRECTORY:?请指定已批准的单一来源目录}
        target: /source
        read_only: true
        bind: {create_host_path: false, propagation: rprivate}
      - type: bind
        source: ${SUPPORTOPS_KNOWLEDGE_READER_POLICY_FILE:?请指定仓库外受保护的读取批准文件}
        target: /etc/supportops-knowledge/reader-policy.json
        read_only: true
        bind: {create_host_path: false}
  api:
    volumes: ["knowledge-reader-ipc:/run/supportops-knowledge-reader:ro"]
volumes:
  knowledge-reader-ipc:
