# 仅挂载两份删除事实快照和只读源码；不挂载归档、连接配置或应用环境。
name: supportops-restore-tombstone-gate
services:
  tombstone-gate:
    image: ${SUPPORTOPS_RESTORE_GATE_IMAGE:?请指定已批准的Python3.12镜像digest}
    user: ${SUPPORTOPS_RESTORE_GATE_UID:?请指定快照所属维护UID}:${SUPPORTOPS_RESTORE_GATE_GID:?请指定维护GID}
    entrypoint: ["python", "-I", "-B", "/opt/supportops/restore_tombstone_gate.py"]
    command: ["--help"]
    volumes:
      - type: bind
        source: ./restore_tombstone_gate.py
        target: /opt/supportops/restore_tombstone_gate.py
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPORTOPS_RESTORE_GATE_SNAPSHOTS_DIR:?请指定只含两份受保护快照的目录}
        target: /snapshots
        read_only: true
        bind: { create_host_path: false }
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1
    pids_limit: 16
    ulimits:
      core: 0
      nofile: { soft: 32, hard: 32 }
      cpu: { soft: 10, hard: 12 }
    init: true
    restart: "no"
    stop_grace_period: 10s
