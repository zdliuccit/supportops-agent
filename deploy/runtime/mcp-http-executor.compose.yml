# 独立显式运行模板；外部网络必须由维护者配置精确出站规则，文件本身不批准目标。
name: supportops-http-mcp-executor
services:
  mcp-http-executor:
    profiles: ["mcp-http-executor"]
    image: ${SUPPORTOPS_MCP_HTTP_EXECUTOR_IMAGE:?请设置已批准的独立HTTP执行镜像引用}
    build:
      context: ../..
      dockerfile: deploy/runtime/mcp-http-executor.Dockerfile
      args:
        PYTHON_IMAGE: ${SUPPORTOPS_PYTHON_IMAGE:?请设置 Python 3.12 的已批准 digest}
        UV_IMAGE: ${SUPPORTOPS_UV_IMAGE:?请设置 uv 的已批准 digest}
    user: "10004:10004"
    group_add: ["10001"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    ulimits:
      nofile: {soft: 64, hard: 64}
      nproc: {soft: 16, hard: 16}
      core: {soft: 0, hard: 0}
      cpu: {soft: 20, hard: 22}
      as: {soft: 536870912, hard: 536870912}
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777"]
    volumes:
      - type: bind
        source: ${SUPPORTOPS_MCP_HTTP_POLICY_FILE:?请提供获批非秘密策略的绝对文件路径}
        target: /etc/supportops-mcp/http-policy.json
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: broker-ipc
        target: /run/supportops-mcp-broker
        read_only: true
        volume: {nocopy: true}
      - type: volume
        source: executor-dispatch
        target: /run/supportops-mcp-executor
        volume: {nocopy: true}
    networks: ["approved-egress"]
    logging: {driver: "none"}
    stdin_open: true
    tty: false
    init: true
    restart: "no"
    stop_grace_period: 3s
    command: ["serve-once"]
volumes:
  broker-ipc:
    external: true
    name: ${SUPPORTOPS_MCP_BROKER_SOCKET_VOLUME:?请提供已配置10003/10004身份的专用socket卷}
  executor-dispatch:
    external: true
    name: ${SUPPORTOPS_MCP_EXECUTOR_DISPATCH_VOLUME:?请提供已配置10001/10004身份的单次派发socket卷}
networks:
  approved-egress:
    external: true
    name: ${SUPPORTOPS_MCP_HTTP_EGRESS_NETWORK:?请提供已配置精确出口规则的独立网络}
