services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${SUPPORTOPS_POSTGRES_DB:-supportops}
      POSTGRES_USER: ${SUPPORTOPS_POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${SUPPORTOPS_POSTGRES_PASSWORD:-agent_dev}
    ports:
      - "${SUPPORTOPS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - supportops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${SUPPORTOPS_REDIS_PORT:-6379}:6379"
    volumes:
      - supportops-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  supportops-postgres:
  supportops-redis:
