[project]
name = "supportops-agent-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/agent_worker", "packages/support_core"]

[tool.uv.sources]
supportops-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/support_core/tests", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["supportops_core", "supportops_api", "supportops_worker"]
