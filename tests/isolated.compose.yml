services:
  postgres:
    image: ${SUPPORTOPS_TEST_POSTGRES_IMAGE:?set a digest-pinned PostgreSQL/pgvector image}
    environment:
      POSTGRES_DB: supportops_test
      POSTGRES_USER: supportops_test
      POSTGRES_PASSWORD: ${SUPPORTOPS_TEST_SECRET:?generated by run-isolated.sh}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 2s
      retries: 30
    mem_limit: 2g
    networks: [integration]

  redis:
    image: ${SUPPORTOPS_TEST_REDIS_IMAGE:?set a digest-pinned Redis image}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${SUPPORTOPS_TEST_SECRET:?generated by run-isolated.sh}"]
    environment:
      REDISCLI_AUTH: ${SUPPORTOPS_TEST_SECRET:?generated by run-isolated.sh}
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
    mem_limit: 256m
    networks: [integration]

  integration:
    image: ${SUPPORTOPS_TEST_RUNNER_IMAGE:?generated by run-isolated.sh}
    build:
      context: ..
      dockerfile: tests/isolated.Dockerfile
      args:
        SUPPORTOPS_TEST_UV_IMAGE: ${SUPPORTOPS_TEST_UV_IMAGE:?set a digest-pinned uv image}
    environment:
      SUPPORTOPS_ENVIRONMENT: test
      SUPPORTOPS_DATABASE_URL: postgresql+asyncpg://supportops_test:${SUPPORTOPS_TEST_SECRET:?generated by run-isolated.sh}@postgres:5432/supportops_test
      SUPPORTOPS_REDIS_URL: redis://:${SUPPORTOPS_TEST_SECRET:?generated by run-isolated.sh}@redis:6379/0
      SUPPORTOPS_RUN_POSTGRES_TESTS: "1"
      SUPPORTOPS_BOOTSTRAP_ADMIN_ENABLED: "false"
      SUPPORTOPS_MODEL_ENDPOINT_ALLOWED_HOSTS: "[]"
      SUPPORTOPS_MODEL_ENDPOINT_ALLOW_PRIVATE_NETWORKS: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 2g
    networks: [integration]

networks:
  integration:
    internal: true
